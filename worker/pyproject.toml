[project]
name = "marvin"
version = "0.1.0"
description = "Marvin: a voice room with a coding agent in it (bridge to coding-agent harnesses)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "boto3>=1.35",
    "claude-agent-sdk>=0.2.152",
    "cryptography>=42",
    "pyjwt>=2.8",
    "faster-whisper>=1.2.1",
    "httpx>=0.27",
    "livekit>=1.1",
    "livekit-api>=1.2",
    "numpy>=2.5.3",
    "onnxruntime>=1.29.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
marvin = "marvin.main:main"
marvin-web = "marvin.token_server:main"
marvin-gate = "marvin.gate:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-aiohttp>=1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marvin"]

[tool.hatch.build.targets.wheel.force-include]
"marvin/license.pub" = "marvin/license.pub"
