[project]
name = "marvin-stt"
version = "0.1.0"
description = "Marvin streaming speech-to-text service: NVIDIA Nemotron 3.5 ASR (cache-aware FastConformer-RNNT) over WebSocket"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nemo-toolkit[asr]==3.0.0",
    "aiohttp>=3.12",
    "numpy",
    "cython",
    "packaging",
]

# CUDA: the Dockerfile installs nemo-toolkit[asr,cu12] (torch==2.12.0+cu126) from the PyTorch index; locally torch comes from PyPI.

[project.scripts]
marvin-stt = "marvin_stt.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.4.0", "pytest-aiohttp>=1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marvin_stt"]
