# Sidecar reverse proxy: https://marvin-<port>.<domain> -> 127.0.0.1:<port> inside the Pod.
# Any port an app publishes (dind shares the Pod network) is reachable this way; hostnames come from the
# ports list in rooms.yaml (one Ingress rule + DNS record each, see apps.yaml).
map $http_upgrade $connection_upgrade { default upgrade; "" close; }
server {
  listen 8081;
  server_name ~^marvin-(?<port>\d+)\.;
  location / {
    proxy_pass http://127.0.0.1:$port;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Dev servers (Vite, Next) accept localhost by default; the real host travels in X-Forwarded-Host.
    proxy_set_header Host "localhost:$port";
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}
server { listen 8081 default_server; return 404 "no app on that port\n"; }
