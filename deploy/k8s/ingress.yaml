# Room UI + token endpoint + LiveKit signaling websocket. Replace marvin.example.com with your hostname (the
# same one as `domain` in rooms.yaml) and point DNS at your ingress controller (or let external-dns do it).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marvin
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    # While Marvin sleeps (web Service has no endpoints) the gate answers instead: "Marvin is asleep" + Wake.
    nginx.ingress.kubernetes.io/default-backend: marvin-gate
    # Some controllers add "Permissions-Policy: camera=(), microphone=()" globally, which makes Chrome deny the mic
    # with no prompt. Marvin needs the mic (and screen share) on this host only.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Permissions-Policy: microphone=(self), camera=(self), display-capture=(self), geolocation=()";
    # Authentication. The web container runs MARVIN_AUTH=header (statefulset.yaml) and trusts identity headers set
    # by the ingress. With oauth2-proxy deployed in the cluster (Deployment + Service `oauth2-proxy`, --set-xauthrequest,
    # --reverse-proxy, --upstream=static://202), uncomment the three annotations and the header mapping. The /rtc path
    # can stay open: the LiveKit JWT minted by /api/token after sign-in is the credential there.
    # nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.oauth2-proxy.svc.cluster.local/oauth2/auth"
    # nginx.ingress.kubernetes.io/auth-signin: "https://marvin.example.com/oauth2/start?rd=$escaped_request_uri"
    # nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User, X-Auth-Request-Email, X-Auth-Request-Preferred-Username, X-Auth-Request-Groups"
    # and, appended to the configuration-snippet above, rename them to what marvin/auth.py reads:
    #   proxy_set_header X-Forwarded-User $http_x_auth_request_user;
    #   proxy_set_header X-Forwarded-Email $http_x_auth_request_email;
    #   proxy_set_header X-Forwarded-Preferred-Username $http_x_auth_request_preferred_username;
    #   proxy_set_header X-Forwarded-Groups $http_x_auth_request_groups;
    # Also expose /oauth2 on this host to the oauth2-proxy Service (a second Ingress or an extra path below), and set
    # MARVIN_TRUSTED_PROXIES in statefulset.yaml to the ingress controller's pod CIDR.
spec:
  ingressClassName: nginx
  rules:
    - host: marvin.example.com
      http:
        paths:
          - path: /power
            pathType: Prefix
            backend: { service: { name: marvin-gate, port: { number: 8091 } } }
          - path: /rtc
            pathType: Prefix
            backend: { service: { name: marvin-livekit, port: { number: 7880 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: marvin-web, port: { number: 8080 } } }
