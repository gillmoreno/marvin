# Room UI + token endpoint + LiveKit signaling websocket. Replace marvin.example.com with your hostname (the
# same one as `domain` in rooms.yaml) and point DNS at your ingress controller (or let external-dns do it).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marvin
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    # While Marvin sleeps (web Service has no endpoints) the gate answers instead: "Marvin is asleep" + Wake.
    nginx.ingress.kubernetes.io/default-backend: marvin-gate
    # Some controllers add "Permissions-Policy: camera=(), microphone=()" globally, which makes Chrome deny the mic
    # with no prompt. Marvin needs the mic (and screen share) on this host only.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Permissions-Policy: microphone=(self), camera=(self), display-capture=(self), geolocation=()";
    # Put SSO in front if you have one, e.g. with an auth-url / oauth2-proxy annotation set:
    # nginx.ingress.kubernetes.io/auth-url: https://sso.example.com/validate
    # nginx.ingress.kubernetes.io/auth-response-headers: X-USER-ID
spec:
  ingressClassName: nginx
  rules:
    - host: marvin.example.com
      http:
        paths:
          - path: /power
            pathType: Prefix
            backend: { service: { name: marvin-gate, port: { number: 8091 } } }
          - path: /rtc
            pathType: Prefix
            backend: { service: { name: marvin-livekit, port: { number: 7880 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: marvin-web, port: { number: 8080 } } }
