# Preview hosts (p3000.<MARVIN_DOMAIN> or the older marvin-3000.<parent>) → that port on the worker.
# Sandboxes share the worker's network namespace, so the app is listening there; this container only forwards.
map $http_upgrade $connection_upgrade { default upgrade; "" close; }
server {
  listen 8081;
  server_name ~^p(?<port>\d+)\. ~^marvin-(?<port>\d+)\.;
  location / {
    proxy_pass http://worker:$port;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Dev servers (Vite, Next) accept localhost by default; the real host travels in X-Forwarded-Host.
    proxy_set_header Host "localhost:$port";
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}
server { listen 8081 default_server; return 404 "no app on that host\n"; }
