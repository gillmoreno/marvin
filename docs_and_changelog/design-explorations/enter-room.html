<!doctype html>
<!-- PROTOTYPE. No sidebar. The room is the whole screen: words, then one box. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>3 — Only the room</title>
<style>
  :root { --bg:#0f1115; --panel:#161920; --line:#252a34; --fg:#e8eaef; --muted:#b0b8c1; --dim:#8b93a2; --accent:#2dd4bf; --ink:#042f2e; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--fg); font: 18px/1.55 "Avenir Next", Avenir, sans-serif; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; padding: 22px 28px; color: var(--dim); font-size: 14px; }
  .top a { color: var(--dim); text-decoration: none; }
  .stage { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; width: min(760px, calc(100% - 48px)); margin: 0 auto; padding-bottom: 28px; }
  .words { display: flex; flex-direction: column; gap: 22px; margin-bottom: 28px; }
  .words b { font-weight: 650; }
  .words .m { color: var(--accent); }
  form { display: flex; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px; }
  input { flex: 1; border: 0; background: transparent; color: var(--fg); font: inherit; padding: 12px 14px; }
  input:focus { outline: none; }
  button { border: 0; border-radius: 12px; background: var(--accent); color: var(--ink); font: inherit; font-weight: 650; padding: 0 18px; }
  .gate h1 { margin: 0 0 12px; font-size: 40px; letter-spacing: -.03em; }
  .gate p { color: var(--muted); margin: 0 0 18px; }
  .flow { position: fixed; left: 28px; bottom: 18px; font-size: 14px; }
  .flow a { color: var(--dim); margin-right: 14px; }
</style>
</head>
<body>
<div class="top"><a href="#">Marvin</a><span id="meta">dev · Gil</span></div>
<div class="stage" id="room">
  <div class="words">
    <div><b>Gil</b><br />Marvin, what is this repository about?</div>
    <div class="m"><b>Marvin</b><br />A voice room. You talk. I work in the repo.</div>
    <div><b>Gil</b><br />Show me the changes when there are some.</div>
  </div>
  <form onsubmit="return false"><input placeholder="Ask Marvin…" /><button>Send</button></form>
</div>
<div class="stage gate" id="setup" hidden>
  <h1>Marvin is not connected.</h1>
  <p>GitHub is missing, and so is a coding agent. The room opens after both.</p>
  <form onsubmit="return false"><input placeholder="Connect GitHub, then the agent" /><button>Start</button></form>
</div>
<p class="flow"><a href="?flow=room">In the project</a><a href="?flow=setup">Not connected</a></p>
<script>
  const setup = new URLSearchParams(location.search).get("flow") === "setup";
  document.getElementById("room").hidden = setup;
  document.getElementById("setup").hidden = !setup;
  document.getElementById("meta").textContent = setup ? "This machine · Gil" : "dev · Gil";
</script>
</body>
</html>
