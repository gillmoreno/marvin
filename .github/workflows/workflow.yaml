name: Marvin
run-name: Marvin ${{ github.ref_name }}

# Pushes to `main` build the worker + web UI image (Dockerfile at the repo root) and push it to the GitHub
# Container Registry as ghcr.io/<owner>/marvin:latest and :sha-<short sha>. Pull requests build without pushing.
# The 4 GB streaming-STT image has its own workflow (workflow-stt.yaml) and only rebuilds when stt/ changes.

on:
  push:
    branches: [main]
    paths-ignore:
      - "stt/**"
      - ".github/workflows/workflow-stt.yaml"
      - "docs_and_changelog/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "stt/**"
      - ".github/workflows/workflow-stt.yaml"
      - "docs_and_changelog/**"
      - "**.md"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/marvin

jobs:
  test:
    name: Worker tests + web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Worker tests
        working-directory: worker
        run: uv sync --frozen && uv run pytest -q
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web typecheck + build
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm exec tsc --noEmit && pnpm build

  image:
    name: Build image (push on main)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
