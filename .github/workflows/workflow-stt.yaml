name: Marvin STT
run-name: Marvin STT ${{ github.ref_name }}

# Streaming speech-to-text image: NVIDIA Nemotron 3.5 ASR via NeMo on CUDA 12.6 wheels (stt/Dockerfile, ~4 GB).
# Pushed to ghcr.io/<owner>/marvin-stt:latest and :sha-<short sha>. It only runs when stt/ changes: moving this
# image through a runner takes a while even on a cache hit, so UI/worker pushes must not trigger it.

on:
  push:
    branches: [main]
    paths:
      - "stt/**"
      - ".github/workflows/workflow-stt.yaml"
  pull_request:
    paths:
      - "stt/**"
      - ".github/workflows/workflow-stt.yaml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/marvin-stt

jobs:
  test:
    name: STT protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Protocol tests (no model download)
        working-directory: stt
        run: uv sync && uv run pytest -q tests/test_server_protocol.py

  image:
    name: Build STT image (push on main)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the CUDA wheels
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: stt
          file: stt/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
